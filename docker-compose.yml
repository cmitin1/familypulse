services:
  db:
    image: postgres:16-alpine
    container_name: familypulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: familypulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: familypulse-backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/familypulse?schema=public
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  web:
    build:
      context: ./web
    container_name: familypulse-web
    restart: unless-stopped
    depends_on:
      - backend
    # Берём публичный API URL из .env (docker compose подхватит его автоматически)
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_INTERNAL_URL: http://backend:4000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules

  caddy:
    image: caddy:2
    container_name: familypulse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
